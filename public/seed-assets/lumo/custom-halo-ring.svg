<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title description">
  <title id="title">Lumo Custom Halo Ring</title>
  <description id="description">A warm gold halo ring with a pale central stone.</description>
  <defs>
    <radialGradient id="background">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#cbbba5"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a8"/>
      <stop offset=".42" stop-color="#b47a2d"/>
      <stop offset=".72" stop-color="#f4cf73"/>
      <stop offset="1" stop-color="#8d5d22"/>
    </linearGradient>
    <radialGradient id="stone">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".65" stop-color="#dce8e7"/>
      <stop offset="1" stop-color="#8da4a2"/>
    </radialGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="26" stdDeviation="22" flood-color="#4e4031" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#background)"/>
  <g filter="url(#shadow)">
    <ellipse cx="600" cy="535" rx="270" ry="225" fill="none" stroke="url(#gold)" stroke-width="62"/>
    <circle cx="600" cy="300" r="118" fill="url(#stone)" stroke="url(#gold)" stroke-width="30"/>
    <circle cx="600" cy="300" r="156" fill="none" stroke="url(#gold)" stroke-dasharray="18 18" stroke-width="24"/>
  </g>
</svg>
