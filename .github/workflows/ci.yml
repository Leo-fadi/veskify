name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-timing.mjs run --id install --output-directory .ci-timings/static -- pnpm install --frozen-lockfile

      - name: Typecheck
        run: node scripts/ci-timing.mjs run --id typecheck --output-directory .ci-timings/static -- pnpm typecheck

      - name: Lint
        run: node scripts/ci-timing.mjs run --id lint --output-directory .ci-timings/static -- pnpm lint

      - name: Check formatting
        run: node scripts/ci-timing.mjs run --id format-check --output-directory .ci-timings/static -- pnpm format:check

      - name: Summarize static timings
        if: always()
        run: node scripts/ci-timing.mjs summarize --profile static --input-directory .ci-timings/static --output .ci-evidence/static-summary.json --job-status "${{ job.status }}"

      - name: Upload static timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timings-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-timings/static
            .ci-evidence/static-summary.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  vitest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-timing.mjs run --id install --output-directory .ci-timings/vitest -- pnpm install --frozen-lockfile

      - name: Run complete one-worker Vitest
        run: node scripts/ci-timing.mjs run --id vitest --output-directory .ci-timings/vitest -- pnpm exec vitest run --maxWorkers=1 --no-file-parallelism

      - name: Summarize Vitest timings
        if: always()
        run: node scripts/ci-timing.mjs summarize --profile vitest --input-directory .ci-timings/vitest --output .ci-evidence/vitest-summary.json --job-status "${{ job.status }}"

      - name: Upload Vitest timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timings-vitest-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-timings/vitest
            .ci-evidence/vitest-summary.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  production-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-timing.mjs run --id install --output-directory .ci-timings/build -- pnpm install --frozen-lockfile

      - name: Restore Next.js incremental cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-node-24-pnpm-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}-${{ hashFiles('next.config.ts', 'postcss.config.mjs', 'tsconfig.json', 'src/**', 'public/**') }}
          restore-keys: |
            next-cache-${{ runner.os }}-node-24-pnpm-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}-

      - name: Build production storefront
        run: node scripts/ci-timing.mjs run --id webpack-build --output-directory .ci-timings/build -- pnpm build:webpack

      - name: Check storefront budgets
        run: node scripts/ci-timing.mjs run --id storefront-budgets --output-directory .ci-timings/build -- pnpm build:check:storefront-budgets

      - name: Summarize production-build timings
        if: always()
        run: node scripts/ci-timing.mjs summarize --profile build --input-directory .ci-timings/build --output .ci-evidence/build-summary.json --job-status "${{ job.status }}"

      - name: Upload production-build timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timings-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-timings/build
            .ci-evidence/build-summary.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  browser-plan:
    name: Browser execution plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Audit locked Playwright execution plan
        run: node scripts/playwright-ci.mjs audit-plan
      - name: Emit bounded browser matrix
        id: matrix
        run: echo "matrix=$(node scripts/playwright-ci.mjs emit-matrix)" >> "$GITHUB_OUTPUT"

  browser-regression:
    name: Browser regression (${{ matrix.groupId }})
    needs: browser-plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.browser-plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: >-
          node scripts/ci-timing.mjs run
          --id install
          --output-directory .ci-timings/browser-${{ matrix.groupId }}
          -- pnpm install --frozen-lockfile
      - name: Install Chromium
        run: >-
          node scripts/ci-timing.mjs run
          --id playwright-install
          --output-directory .ci-timings/browser-${{ matrix.groupId }}
          -- pnpm exec playwright install --with-deps chromium
      - name: Run locked Playwright group
        run: >-
          node scripts/ci-timing.mjs run
          --id playwright-e2e
          --output-directory .ci-timings/browser-${{ matrix.groupId }}
          -- node scripts/playwright-ci.mjs run-group
          --group-id ${{ matrix.groupId }}
          --output-directory .ci-playwright-groups
      - name: Summarize browser group timings
        if: ${{ always() && !cancelled() }}
        run: >-
          node scripts/ci-timing.mjs summarize
          --profile browser
          --input-directory .ci-timings/browser-${{ matrix.groupId }}
          --output .ci-playwright-groups/${{ matrix.groupId }}/ci-browser-summary.json
          --job-status ${{ job.status }}
      - name: Upload browser group evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-group-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.groupId }}
          path: |
            .ci-playwright-groups/${{ matrix.groupId }}/manifest.json
            .ci-playwright-groups/${{ matrix.groupId }}/timings
            .ci-playwright-groups/${{ matrix.groupId }}/ci-browser-summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload browser blob reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-group-blobs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.groupId }}
          path: .ci-playwright-groups/${{ matrix.groupId }}/blobs
          if-no-files-found: warn
          retention-days: 3

  browser-report:
    name: Browser merged report
    needs:
      - browser-plan
      - browser-regression
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download browser group evidence
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-group-evidence-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .ci-matrix-input/evidence
          merge-multiple: false
      - name: Download browser blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-group-blobs-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .ci-matrix-input/blobs
          merge-multiple: false
      - name: Validate complete matrix artifacts
        run: >-
          node scripts/playwright-ci.mjs validate-group-artifacts
          --evidence-directory .ci-matrix-input/evidence
          --blob-directory .ci-matrix-input/blobs
          --blob-output-directory .ci-merged-blobs
          --artifact-run-id ${{ github.run_id }}
          --artifact-run-attempt ${{ github.run_attempt }}
          --output .ci-evidence/playwright-matrix-validation.json
      - name: Merge Playwright blob reports
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: .ci-playwright-report
        run: pnpm exec playwright merge-reports --reporter=html .ci-merged-blobs
      - name: Summarize browser matrix timings
        run: >-
          node scripts/playwright-ci.mjs summarize-matrix
          --validation .ci-evidence/playwright-matrix-validation.json
          --output .ci-evidence/playwright-matrix-timing-summary.json
          --merge-result success
      - name: Upload browser matrix evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-matrix-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-evidence/playwright-matrix-validation.json
            .ci-evidence/playwright-matrix-timing-summary.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload merged Playwright report
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-merged-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-playwright-report
          if-no-files-found: warn
          retention-days: 14

  validate:
    needs:
      - static-checks
      - vitest
      - production-build
      - browser-plan
      - browser-regression
      - browser-report
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job
        run: |
          test "${{ needs.static-checks.result }}" = "success"
          test "${{ needs.vitest.result }}" = "success"
          test "${{ needs.production-build.result }}" = "success"
          test "${{ needs.browser-plan.result }}" = "success"
          test "${{ needs.browser-regression.result }}" = "success"
          test "${{ needs.browser-report.result }}" = "success"
