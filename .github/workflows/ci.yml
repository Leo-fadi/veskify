name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-timing.mjs run --id install --output-directory .ci-timings/static -- pnpm install --frozen-lockfile

      - name: Typecheck
        run: node scripts/ci-timing.mjs run --id typecheck --output-directory .ci-timings/static -- pnpm typecheck

      - name: Lint
        run: node scripts/ci-timing.mjs run --id lint --output-directory .ci-timings/static -- pnpm lint

      - name: Check formatting
        run: node scripts/ci-timing.mjs run --id format-check --output-directory .ci-timings/static -- pnpm format:check

      - name: Summarize static timings
        if: always()
        run: node scripts/ci-timing.mjs summarize --profile static --input-directory .ci-timings/static --output .ci-evidence/static-summary.json --job-status "${{ job.status }}"

      - name: Upload static timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timings-static-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-timings/static
            .ci-evidence/static-summary.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  vitest-plan:
    name: Vitest execution plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Discover complete Vitest inventory
        run: |
          mkdir -p .ci-vitest-plan
          pnpm exec vitest list --filesOnly --json > .ci-vitest-plan/discovery.json

      - name: Audit locked Vitest plan
        run: >-
          node scripts/vitest-ci.mjs audit-plan
          --discovery .ci-vitest-plan/discovery.json
          --output .ci-vitest-plan/discovery-audit.json

      - name: Emit bounded Vitest matrix
        id: matrix
        run: echo "matrix=$(node scripts/vitest-ci.mjs emit-matrix)" >> "$GITHUB_OUTPUT"

      - name: Upload Vitest plan evidence
        uses: actions/upload-artifact@v4
        with:
          name: vitest-plan-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-vitest-plan/discovery-audit.json
          if-no-files-found: error
          retention-days: 14

  vitest-shard:
    name: Vitest (${{ matrix.shardId }})
    needs: vitest-plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.vitest-plan.outputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: >-
          node scripts/ci-timing.mjs run
          --id install
          --output-directory .ci-timings/vitest-${{ matrix.shardId }}
          -- pnpm install --frozen-lockfile

      - name: Download Vitest plan evidence
        uses: actions/download-artifact@v4
        with:
          name: vitest-plan-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-vitest-plan-input

      - name: Prepare isolated Vitest evidence
        run: mkdir -p .ci-vitest-shards/${{ matrix.shardId }}/blobs

      - name: Run complete one-worker Vitest shard
        run: >-
          node scripts/ci-timing.mjs run
          --id vitest
          --output-directory .ci-timings/vitest-${{ matrix.shardId }}
          -- pnpm exec vitest run --maxWorkers=1 --no-file-parallelism
          --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
          --reporter=blob
          --outputFile=.ci-vitest-shards/${{ matrix.shardId }}/blobs/${{ matrix.shardId }}.json

      - name: Summarize Vitest shard timings
        if: ${{ always() && !cancelled() }}
        run: >-
          node scripts/ci-timing.mjs summarize
          --profile vitest
          --input-directory .ci-timings/vitest-${{ matrix.shardId }}
          --output .ci-vitest-shards/${{ matrix.shardId }}/ci-vitest-summary.json
          --job-status ${{ job.status }}

      - name: Persist truthful Vitest shard manifest
        if: ${{ always() && !cancelled() }}
        run: >-
          node scripts/vitest-ci.mjs write-shard-manifest
          --shard-id ${{ matrix.shardId }}
          --discovery-audit .ci-vitest-plan-input/discovery-audit.json
          --timing-summary .ci-vitest-shards/${{ matrix.shardId }}/ci-vitest-summary.json
          --blob .ci-vitest-shards/${{ matrix.shardId }}/blobs/${{ matrix.shardId }}.json
          --job-status ${{ job.status }}
          --artifact-run-id ${{ github.run_id }}
          --artifact-run-attempt ${{ github.run_attempt }}
          --output .ci-vitest-shards/${{ matrix.shardId }}/manifest.json

      - name: Upload Vitest shard evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-shard-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shardId }}
          path: |
            .ci-vitest-shards/${{ matrix.shardId }}/manifest.json
            .ci-vitest-shards/${{ matrix.shardId }}/ci-vitest-summary.json
            .ci-timings/vitest-${{ matrix.shardId }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload Vitest shard blob
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-shard-blob-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shardId }}
          path: .ci-vitest-shards/${{ matrix.shardId }}/blobs/${{ matrix.shardId }}.json
          if-no-files-found: warn
          retention-days: 3

  vitest-report:
    name: Vitest merged report
    needs:
      - vitest-plan
      - vitest-shard
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Vitest plan evidence
        uses: actions/download-artifact@v4
        with:
          name: vitest-plan-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: .ci-vitest-plan-input

      - name: Download Vitest shard evidence
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-shard-evidence-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .ci-vitest-matrix-input/evidence
          merge-multiple: false

      - name: Download Vitest shard blobs
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-shard-blob-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .ci-vitest-matrix-input/blobs
          merge-multiple: false

      - name: Reconcile complete Vitest shard artifacts
        run: >-
          node scripts/vitest-ci.mjs validate-shard-artifacts
          --evidence-directory .ci-vitest-matrix-input/evidence
          --blob-directory .ci-vitest-matrix-input/blobs
          --discovery-audit .ci-vitest-plan-input/discovery-audit.json
          --blob-output-directory .ci-merged-vitest-blobs
          --artifact-run-id ${{ github.run_id }}
          --artifact-run-attempt ${{ github.run_attempt }}
          --output .ci-evidence/vitest-matrix-validation.json

      - name: Merge Vitest blob reports
        run: >-
          pnpm exec vitest
          --merge-reports=.ci-merged-vitest-blobs
          --reporter=json
          --outputFile=.ci-evidence/vitest-merged-result.json

      - name: Validate merged Vitest result
        run: >-
          node scripts/vitest-ci.mjs validate-merged-report
          --merged-result .ci-evidence/vitest-merged-result.json
          --discovery-audit .ci-vitest-plan-input/discovery-audit.json
          --artifact-validation .ci-evidence/vitest-matrix-validation.json
          --output .ci-evidence/vitest-validated-result.json

      - name: Upload Vitest matrix evidence
        uses: actions/upload-artifact@v4
        with:
          name: vitest-matrix-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-evidence/vitest-matrix-validation.json
            .ci-evidence/vitest-validated-result.json
          if-no-files-found: error
          retention-days: 14

  production-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: node scripts/ci-timing.mjs run --id install --output-directory .ci-timings/build -- pnpm install --frozen-lockfile

      - name: Restore Next.js incremental cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-cache-${{ runner.os }}-node-24-pnpm-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}-${{ hashFiles('next.config.ts', 'postcss.config.mjs', 'tsconfig.json', 'src/**', 'public/**') }}
          restore-keys: |
            next-cache-${{ runner.os }}-node-24-pnpm-${{ hashFiles('pnpm-lock.yaml', 'package.json') }}-

      - name: Build production storefront
        run: node scripts/ci-timing.mjs run --id webpack-build --output-directory .ci-timings/build -- pnpm build:webpack

      - name: Check storefront budgets
        run: node scripts/ci-timing.mjs run --id storefront-budgets --output-directory .ci-timings/build -- pnpm build:check:storefront-budgets

      - name: Summarize production-build timings
        if: always()
        run: node scripts/ci-timing.mjs summarize --profile build --input-directory .ci-timings/build --output .ci-evidence/build-summary.json --job-status "${{ job.status }}"

      - name: Upload production-build timing evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-timings-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-timings/build
            .ci-evidence/build-summary.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  browser-plan:
    name: Browser execution plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Audit locked Playwright execution plan
        run: node scripts/playwright-ci.mjs audit-plan
      - name: Emit bounded browser matrix
        id: matrix
        run: echo "matrix=$(node scripts/playwright-ci.mjs emit-matrix)" >> "$GITHUB_OUTPUT"

  browser-regression:
    name: Browser regression (${{ matrix.groupId }})
    needs: browser-plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.browser-plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: >-
          node scripts/ci-timing.mjs run
          --id install
          --output-directory .ci-timings/browser-${{ matrix.groupId }}
          -- pnpm install --frozen-lockfile
      - name: Install Chromium
        run: >-
          node scripts/ci-timing.mjs run
          --id playwright-install
          --output-directory .ci-timings/browser-${{ matrix.groupId }}
          -- pnpm exec playwright install --with-deps chromium
      - name: Run locked Playwright group
        run: >-
          node scripts/ci-timing.mjs run
          --id playwright-e2e
          --output-directory .ci-timings/browser-${{ matrix.groupId }}
          -- node scripts/playwright-ci.mjs run-group
          --group-id ${{ matrix.groupId }}
          --output-directory .ci-playwright-groups
      - name: Summarize browser group timings
        if: ${{ always() && !cancelled() }}
        run: >-
          node scripts/ci-timing.mjs summarize
          --profile browser
          --input-directory .ci-timings/browser-${{ matrix.groupId }}
          --output .ci-playwright-groups/${{ matrix.groupId }}/ci-browser-summary.json
          --job-status ${{ job.status }}
      - name: Upload browser group evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-group-evidence-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.groupId }}
          path: |
            .ci-playwright-groups/${{ matrix.groupId }}/manifest.json
            .ci-playwright-groups/${{ matrix.groupId }}/timings
            .ci-playwright-groups/${{ matrix.groupId }}/ci-browser-summary.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload browser blob reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-group-blobs-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.groupId }}
          path: .ci-playwright-groups/${{ matrix.groupId }}/blobs
          if-no-files-found: warn
          retention-days: 3

  browser-report:
    name: Browser merged report
    needs:
      - browser-plan
      - browser-regression
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download browser group evidence
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-group-evidence-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .ci-matrix-input/evidence
          merge-multiple: false
      - name: Download browser blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: playwright-group-blobs-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .ci-matrix-input/blobs
          merge-multiple: false
      - name: Validate complete matrix artifacts
        run: >-
          node scripts/playwright-ci.mjs validate-group-artifacts
          --evidence-directory .ci-matrix-input/evidence
          --blob-directory .ci-matrix-input/blobs
          --blob-output-directory .ci-merged-blobs
          --artifact-run-id ${{ github.run_id }}
          --artifact-run-attempt ${{ github.run_attempt }}
          --output .ci-evidence/playwright-matrix-validation.json
      - name: Merge Playwright blob reports
        env:
          PLAYWRIGHT_HTML_OPEN: never
          PLAYWRIGHT_HTML_OUTPUT_DIR: ci-playwright-report
        run: |
          printf '%s\n' 'export default { testDir: "./tests" };' > .ci-playwright-merge.config.mjs
          pnpm exec playwright merge-reports \
            -c .ci-playwright-merge.config.mjs \
            --reporter=html \
            .ci-merged-blobs
      - name: Summarize browser matrix timings
        run: >-
          node scripts/playwright-ci.mjs summarize-matrix
          --validation .ci-evidence/playwright-matrix-validation.json
          --output .ci-evidence/playwright-matrix-timing-summary.json
          --merge-result success
      - name: Upload browser matrix evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-matrix-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .ci-evidence/playwright-matrix-validation.json
            .ci-evidence/playwright-matrix-timing-summary.json
          if-no-files-found: warn
          retention-days: 14
      - name: Upload merged Playwright report
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-merged-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-playwright-report
          if-no-files-found: error
          retention-days: 14

  validate:
    needs:
      - static-checks
      - vitest-plan
      - vitest-shard
      - vitest-report
      - production-build
      - browser-plan
      - browser-regression
      - browser-report
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job
        run: |
          test "${{ needs.static-checks.result }}" = "success"
          test "${{ needs.vitest-plan.result }}" = "success"
          test "${{ needs.vitest-shard.result }}" = "success"
          test "${{ needs.vitest-report.result }}" = "success"
          test "${{ needs.production-build.result }}" = "success"
          test "${{ needs.browser-plan.result }}" = "success"
          test "${{ needs.browser-regression.result }}" = "success"
          test "${{ needs.browser-report.result }}" = "success"
