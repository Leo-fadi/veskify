name: CI

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Run Vitest without cross-file contention
        run: pnpm exec vitest run --maxWorkers=1 --no-file-parallelism
      - name: Production build (Webpack)
        run: pnpm build:webpack
      - name: Storefront first-load budgets
        run: pnpm build:check:storefront-budgets
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
